<style>
*{box-sizing:border-box}
body{margin:0;background:#e9ecea;font-family:Arial,sans-serif;color:#222}
.toolbar{position:sticky;top:0;z-index:10;background:#234b38;color:white;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{border:0;border-radius:7px;padding:10px 12px;font-size:14px;font-weight:bold}
.toolbar button{background:white;color:#234b38}
.hint{font-size:13px;padding:8px 12px;text-align:center;background:#fff8d8}
.sheet{position:relative;width:min(100%,794px);margin:12px auto;background:white;aspect-ratio:768 / 1086;box-shadow:0 2px 12px #0002;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.field,.check{position:absolute;z-index:2}
.field input,.field textarea{width:100%;height:100%;margin:0;padding:1px 3px;border:1px solid #5e8f7b;border-radius:2px;background:rgba(255,255,255,.86);font:10px Arial,sans-serif;color:#111;outline:none}
.field textarea{resize:none;vertical-align:top}
.field input:focus,.field textarea:focus{background:#fff;border:1px solid #174f38}
.check{margin:0;width:2.1%;height:auto;aspect-ratio:1;accent-color:#174f38;cursor:pointer;opacity:.92}
@media(max-width:500px){.field input,.field textarea{font-size:8px}.toolbar button{padding:9px;font-size:12px}}
@page{size:A4 portrait;margin:0}
@media print{
body{background:white}
.toolbar,.hint{display:none!important}
.sheet{width:210mm;height:297mm;aspect-ratio:auto;margin:0;box-shadow:none;page-break-after:avoid}
.field input,.field textarea{border:0;border-radius:0;background:transparent!important;color:#000;font-size:9pt;padding:0 2px;appearance:none;-webkit-appearance:none}
.check{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style></head><body>

<script>
const form=document.getElementById('formFicha');
function getData(){const d={fields:{},checks:[]};form.querySelectorAll('.field input,.field textarea').forEach(e=>d.fields[e.name]=e.value);form.querySelectorAll('.check:checked').forEach(e=>d.checks.push(e.value));return d}
function setData(d){form.querySelectorAll('.field input,.field textarea').forEach(e=>e.value=(d.fields||{})[e.name]||'');form.querySelectorAll('.check').forEach(e=>e.checked=(d.checks||[]).includes(e.value))}
function guardar(){localStorage.setItem('fichaSondagemOriginal',JSON.stringify(getData()));alert('Preenchimento guardado neste navegador.')}
function recuperar(){const d=localStorage.getItem('fichaSondagemOriginal');if(!d){alert('Não há preenchimento guardado.');return}setData(JSON.parse(d));alert('Preenchimento recuperado.')}
function nova(){if(!confirm('Começar uma ficha nova? Guarde o preenchimento atual antes, se precisar.'))return;form.reset()}
</script></body></html>
